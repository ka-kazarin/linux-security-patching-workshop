# Virtual patch for wp2shell (CVE-2026-63030 + CVE-2026-60137).
# A narrow rule for an exploitation technique confirmed live against the
# stand (see exploit/README.md): route confusion via a malformed first
# sub-request ("path": "http://:") inside batch/v1, which shifts dispatch and
# makes the nested batch get processed as a second routing pass. A legitimate
# WordPress client never sends such a malformed path — the signature is
# specific to this exploitation technique, not to the exact SQL payload
# inside it. Toggled via make waf-on / waf-off.
#
# NOTE: this ModSecurity-nginx build (v1.0.3) doesn't correctly match an
# @contains operand containing an escaped quote (\" or \x22) — found live:
# the rule PARSES fine (`nginx -t` passes) but never actually matches at
# runtime, verified by testing an isolated single-condition rule against a
# real curl request and checking the HTTP status. The original signature was
# `path":"http://:` (quoted, most specific); dropped the quotes rather than
# fight the connector — `http://:` alone (an empty-host URL with a bare
# colon after the scheme) is still not something any legitimate WordPress
# client would ever send, so it stays a narrow, technique-specific match.

SecRule REQUEST_URI "@contains rest_route=/batch/v1" \
    "id:1002026063030,\
     phase:2,\
     chain,\
     t:none,t:urlDecodeUni,t:lowercase,\
     msg:'wp2shell batch-route confusion blocked (CVE-2026-63030/-60137)',\
     tag:'cve/CVE-2026-63030',\
     tag:'cve/CVE-2026-60137',\
     severity:'CRITICAL',\
     deny,status:403"
    SecRule REQUEST_BODY|ARGS "@contains http://:" \
        "t:none,t:urlDecodeUni,t:lowercase"
