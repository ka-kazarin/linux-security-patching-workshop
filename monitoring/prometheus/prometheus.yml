# Prometheus scrape config for the stand. Check metric names against the
# real exporters (rules/configs.md) — no dead panels allowed.
global:
  scrape_interval: 5s          # frequent interval: the livepatch line needs to be detailed

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      # Availability of the stand's web node (probed via blackbox_exporter).
      - targets: ["http://192.168.56.10"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
