# Monitoring stack for the service-continuity demo. Runs on its own `mon`
# node, brought up ahead of time. Image tags are pinned (rules/configs.md),
# configs are mounted read-only, dashboards and datasources are provisioned
# from files, no manual UI state.
#
# node_exporter is NOT here: it runs natively on every stand node (web/db/
# mon, Ubuntu and Oracle Linux — see stand/provision/common.sh) so Prometheus
# gets real per-host kernel uptime instead of only ever seeing this one
# container's host.
name: secpatch-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.5.1
    ports: ["3000:3000"]
    environment:
      # Demo stand: anonymous access so nobody has to log in during the webinar. Not for prod.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.26.0
    ports: ["9115:9115"]
    # Default config (baked into the image) already ships http_2xx and
    # tcp_connect — exactly the two modules this stand needs, no custom
    # config to mount.
    # Availability probes: http_2xx for the web nodes, tcp_connect for MySQL —
    # a visible flat line/drop across a restart is the continuity demo.
