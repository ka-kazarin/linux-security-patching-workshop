# Ansible auto-discovers ./ansible.cfg from the current working directory —
# the Makefile always invokes ansible-playbook from the repo root, so this
# file lives here, not next to the playbooks in ansible/.
[defaults]
# Every playbook here reads facts as ansible_facts['...'] (see
# ansible/patch.yml) — no need for the deprecated top-level ansible_*
# vars this used to inject.
inject_facts_as_vars = False
# Give a host that's briefly settling (just resumed, or right after an online
# snapshot during rollout) room to answer instead of failing UNREACHABLE.
timeout = 30

[ssh_connection]
# Transport-level retry for transient connection drops -- the first line of
# defence against "network problems" the user asked for: SSH itself retries
# before a task is declared unreachable. Task-level `until/retries` in the
# playbooks handles a flaky mirror mid-run; this handles the connection.
retries = 3
