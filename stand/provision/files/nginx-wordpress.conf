# nginx server block for the web-app node. Read by web-app.sh, copied into
# /etc/nginx/sites-available/wordpress. PHP-FPM listens on a unix socket.
server {
	listen 80 default_server;
	server_name _;
	root /var/www/html;
	index index.php index.html;

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
		fastcgi_pass unix:/run/php/php-fpm.sock;
	}

	location ~ /\.ht {
		deny all;
	}
}
