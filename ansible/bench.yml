---
# Load baseline for "did the patch slow anything down" -- NOT a rigorous
# benchmark, and NOT peak-throughput. Methodology: fixed sub-saturation
# rate + latency. A rate below each endpoint's ceiling is held constant
# (vegeta -rate=N / sysbench --rate=N); what's measured is whether p95
# latency at that steady rate held up, not how much throughput was
# squeezed out. Peak-throughput numbers on a shared, single-core-starved
# demo VM swing wildly run to run (±30-56%, measured live) because they
# chase whatever the VM's noisy-neighbour scheduling allows *this second*;
# latency at a rate safely under the ceiling barely moves, because the
# server was never queueing in the first place.
#
# Per metric: 1 warmup run (discarded -- absorbs cold PHP-FPM/opcache /
# OS disk cache so it can't masquerade as a regression) + BENCH_RUNS timed
# runs. Each timed run is sampled at a fixed interval by re-running the
# tool in short windows, one sample per window. Median p95 (+ success
# rate) across every sample from BOTH timed runs drives the before/after
# verdict (scan/bench_compare.py); p50 rides along for context wherever
# the tool exposes it. Durations are Makefile-driven
# (BENCH_WARMUP/BENCH_DURATION/BENCH_RUNS/BENCH_INTERVAL -e overrides).
#
# Stage only, hard-coded: bench-before/after measure "did patching THIS
# host slow THIS host down" -- there is no cross-env comparison, unlike
# scan (whose delta is per-env by design). Running against prod as well
# would just add VM-suspend churn for a number nobody diffs.
#
# Tools -- one per layer (AGENTS.md "one tool per step"):
#  - web host (nginx static file + WordPress PHP page): vegeta, a single
#    Go binary. No built-in interval reporting, so a timed run IS a
#    sequence of short vegeta windows (attack -rate=R -duration=<interval>s
#    | report -type=json); each window's JSON report is one sample
#    (p50/p95 latency + success rate at the held rate). Rates are picked
#    BELOW each endpoint's ceiling (verified live against this stand's
#    web-stage): the static file nginx serves directly has no meaningful
#    ceiling on this VM (500 req/s stays sub-millisecond), the WordPress
#    home page (PHP-FPM + MySQL) caps out near ~25 req/s at wrk -c10, so
#    10 req/s keeps it warm without ever queueing (p95 ~85-90ms, stable
#    across back-to-back runs after warmup).
#  - db host (MySQL): sysbench oltp_read_only --rate=N (EPEL package),
#    rate-limited well under its own read-only ceiling. Its own
#    --report-interval windows the run for us -- one sysbench process per
#    timed run, printing one sample line per interval (tps + the tool's
#    own p95 latency + err/s, from which the sample's success rate is
#    derived).
#
# Vars: out=path without extension (default results/bench) -- .json gets
# appended.
- name: Reset bench workspace on the controller
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    # A workspace scoped to this run must not pick up raw output a
    # previous run left behind.
    - name: Clear per-host raw output left over from a previous run
      ansible.builtin.file:
        path: /tmp/stand-bench
        state: "{{ item }}"
      loop: [absent, directory]

- name: Benchmark hosts (stage, fixed sub-saturation rate + latency)
  hosts: stage
  become: true
  vars:
    # Methodology knobs -- overridden from the Makefile via -e bench_*.
    bench_warmup: 20      # seconds, one run, discarded
    bench_duration: 60    # seconds per timed run
    bench_runs: 2         # timed runs per metric
    bench_interval: 10    # seconds per sample window
    # Static file nginx serves directly (not routed through PHP-FPM) --
    # confirmed live with `curl -sI` against web-stage: WordPress core always
    # ships this file, and nginx's `try_files` in nginx-wordpress.conf hands
    # a plain file straight back without touching index.php.
    static_path: /wp-includes/js/wp-embed.min.js
    # Fixed rates, each verified live to sit below its endpoint's ceiling so
    # success stays ~100% and latency stays flat instead of climbing under
    # queueing -- see the file header for the numbers behind these picks.
    vegeta_static_rate: 500   # req/s, nginx static file
    vegeta_php_rate: 10       # req/s, WordPress home page (PHP-FPM + MySQL)
    vegeta_version: "12.13.0"  # latest release, verified live against
    # https://api.github.com/repos/tsenart/vegeta/releases/latest
    sysbench_tables: 2
    sysbench_table_size: 10000
    sysbench_threads: 4
    mysql_rate: 200            # tps, sysbench oltp_read_only --rate
  tasks:
    # --- web host: nginx (static) + PHP-FPM+MySQL (WordPress home) --------
    - name: Install vegeta (web hosts only, idempotent safety net -- common.sh pre-installs it)
      ansible.builtin.shell: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64) arch=arm64 ;;
          *) echo "bench: unsupported arch $(uname -m) for vegeta" >&2; exit 1 ;;
        esac
        curl -fsSL "https://github.com/tsenart/vegeta/releases/download/v{{ vegeta_version }}/vegeta_{{ vegeta_version }}_linux_${arch}.tar.gz" \
          | tar -xz -C /tmp vegeta
        install -m 0755 /tmp/vegeta /usr/local/bin/vegeta
        rm -f /tmp/vegeta
      args:
        creates: /usr/local/bin/vegeta
      when: "'web' in group_names"

    - name: Warmup + timed windows against a real static file served by nginx (vegeta, fixed rate)
      ansible.builtin.shell: |
        set -euo pipefail
        URL="http://localhost{{ static_path }}"
        RATE={{ vegeta_static_rate }}
        echo "### warmup (discarded)" >&2
        echo "GET $URL" | vegeta attack -rate=$RATE -duration={{ bench_warmup }}s > /dev/null
        windows=$(( {{ bench_duration }} / {{ bench_interval }} ))
        for run in $(seq 1 {{ bench_runs }}); do
          echo "### run $run" >&2
          for w in $(seq 1 "$windows"); do
            echo "### window t=$(( (w - 1) * {{ bench_interval }} ))" >&2
            echo "GET $URL" | vegeta attack -rate=$RATE -duration={{ bench_interval }}s | vegeta report -type=json
          done
        done
      register: vegeta_static_result
      changed_when: false
      when: "'web' in group_names"

    - name: Save raw vegeta (nginx-static) output for the controller to parse
      ansible.builtin.copy:
        content: "RATE={{ vegeta_static_rate }}\n{{ vegeta_static_result.stdout }}"
        dest: /tmp/stand-bench/{{ inventory_hostname }}-nginx-static.txt
      delegate_to: localhost
      become: false
      when: "'web' in group_names"

    - name: Warmup + timed windows against the WordPress home page (vegeta, fixed rate)
      ansible.builtin.shell: |
        set -euo pipefail
        URL="http://localhost/"
        RATE={{ vegeta_php_rate }}
        echo "### warmup (discarded)" >&2
        echo "GET $URL" | vegeta attack -rate=$RATE -duration={{ bench_warmup }}s > /dev/null
        windows=$(( {{ bench_duration }} / {{ bench_interval }} ))
        for run in $(seq 1 {{ bench_runs }}); do
          echo "### run $run" >&2
          for w in $(seq 1 "$windows"); do
            echo "### window t=$(( (w - 1) * {{ bench_interval }} ))" >&2
            echo "GET $URL" | vegeta attack -rate=$RATE -duration={{ bench_interval }}s | vegeta report -type=json
          done
        done
      register: vegeta_php_result
      changed_when: false
      when: "'web' in group_names"

    - name: Save raw vegeta (php) output for the controller to parse
      ansible.builtin.copy:
        content: "RATE={{ vegeta_php_rate }}\n{{ vegeta_php_result.stdout }}"
        dest: /tmp/stand-bench/{{ inventory_hostname }}-php.txt
      delegate_to: localhost
      become: false
      when: "'web' in group_names"

    # --- db host: sysbench oltp_read_only against the local MySQL server --
    - name: Install EPEL (db hosts only, needed for sysbench)
      ansible.builtin.dnf:
        name: epel-release
        state: present
      when: "'db' in group_names"

    - name: Install sysbench (db hosts only)
      ansible.builtin.dnf:
        name: sysbench
        state: present
      when: "'db' in group_names"

    - name: Create a dedicated sysbench database (idempotent, db hosts only)
      ansible.builtin.command:
        cmd: mysql -uroot -e "CREATE DATABASE IF NOT EXISTS sbtest CHARACTER SET utf8mb4;"
      changed_when: true
      when: "'db' in group_names"

    # sysbench prepare has no "IF NOT EXISTS" flag of its own -- check for
    # the last table it would create and skip the (re-)load when it's
    # already there, same idempotence contract as the rest of the stand.
    - name: Check whether sysbench tables are already prepared (db hosts only)
      ansible.builtin.command:
        cmd: >
          mysql -uroot -N -e
          "SELECT COUNT(*) FROM information_schema.tables
           WHERE table_schema='sbtest' AND table_name='sbtest{{ sysbench_tables }}';"
      register: sysbench_table_check
      changed_when: false
      when: "'db' in group_names"

    - name: Prepare sysbench oltp_read_only tables (idempotent, db hosts only)
      ansible.builtin.command:
        cmd: >
          sysbench oltp_read_only --db-driver=mysql --mysql-user=root
          --mysql-db=sbtest --mysql-socket=/var/lib/mysql/mysql.sock
          --tables={{ sysbench_tables }} --table-size={{ sysbench_table_size }} prepare
      when: >
        'db' in group_names and
        (sysbench_table_check.stdout | default('0') | trim) == '0'
      changed_when: true

    - name: Warmup + timed runs of sysbench oltp_read_only (db hosts only, fixed rate)
      ansible.builtin.shell: |
        set -euo pipefail
        ARGS="--db-driver=mysql --mysql-user=root --mysql-db=sbtest --mysql-socket=/var/lib/mysql/mysql.sock --tables={{ sysbench_tables }} --table-size={{ sysbench_table_size }} --threads={{ sysbench_threads }} --rate={{ mysql_rate }}"
        echo "### warmup"
        sysbench oltp_read_only $ARGS --time={{ bench_warmup }} run >/dev/null
        for run in $(seq 1 {{ bench_runs }}); do
          echo "### run $run"
          sysbench oltp_read_only $ARGS --time={{ bench_duration }} --report-interval={{ bench_interval }} run
        done
      register: sysbench_result
      changed_when: false
      when: "'db' in group_names"

    - name: Save raw sysbench output for the controller to parse
      ansible.builtin.copy:
        content: "RATE={{ mysql_rate }}\n{{ sysbench_result.stdout }}"
        dest: /tmp/stand-bench/{{ inventory_hostname }}-mysql.txt
      delegate_to: localhost
      become: false
      when: "'db' in group_names"

- name: Parse raw output and write the bench JSON (controller-side)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Same cwd caveat as scan.yml: connection: local runs with cwd =
    # ansible/, not wherever ansible-playbook was invoked from.
    repo_root: "{{ playbook_dir }}/.."
    out_base: "{{ repo_root }}/{{ out | default('results/bench') }}"
    bench_interval: 10
  tasks:
    - name: Parse raw vegeta/sysbench output into the bench JSON schema (samples + median p95/success)
      ansible.builtin.shell: |
        python3 -c "
        import glob, json, re, statistics

        BENCH_INTERVAL = {{ bench_interval }}

        def chunks_of(text):
            # Every marker line starts with '### '; prefixing a newline lets
            # one split cleanly return every marker+body as its own chunk.
            return [c for c in ('\n' + text).split('\n### ') if c.strip()]

        def parse_vegeta(text, name):
            # Every line of raw output is one 'vegeta report -type=json'
            # object -- one per short window. Warmup output is silenced with
            # '>/dev/null' in the shell task, so there is nothing to skip
            # here, unlike the marker-based sysbench text below.
            samples = []
            for line in text.splitlines():
                line = line.strip()
                if not line:
                    continue
                report = json.loads(line)
                lat = report['latencies']
                samples.append({
                    'p50_ms': lat['50th'] / 1e6,
                    'p95_ms': lat['95th'] / 1e6,
                    'success': report['success'],
                })
            if not samples:
                raise SystemExit(f'bench: no vegeta samples parsed from {name}')
            return samples

        def parse_sysbench(text, name):
            # sysbench's own --report-interval already windows the run for
            # us: one process per timed run, one '[ Ns ]' line per sample
            # (tps + its own p95 latency + err/s). p50 isn't exposed by the
            # periodic line, so sysbench samples carry p95 only -- p50_ms is
            # None and the compare script shows '-' for it.
            samples = []
            for chunk in chunks_of(text):
                marker, _, body = chunk.partition('\n')
                marker = marker.strip()
                if marker.startswith('warmup'):
                    continue
                if not marker.startswith('run '):
                    raise SystemExit(f'bench: unexpected sysbench marker {marker!r} in {name}')
                for m in re.finditer(
                        r'tps:\s+([0-9.]+).*?lat \(ms,\d+%\):\s+([0-9.]+).*?err/s:\s+([0-9.]+)', body):
                    tps, p95, err = float(m.group(1)), float(m.group(2)), float(m.group(3))
                    total = tps + err
                    samples.append({
                        'p50_ms': None,
                        'p95_ms': p95,
                        'success': 1.0 if total == 0 else max(0.0, min(1.0, tps / total)),
                    })
            if not samples:
                raise SystemExit(f'bench: no sysbench samples parsed from {name}')
            return samples

        entries = []
        for path in sorted(glob.glob('/tmp/stand-bench/*.txt')):
            name = path.rsplit('/', 1)[-1][:-4]  # <host>-<metric>
            text = open(path, encoding='utf-8').read()
            first_line, _, body = text.partition('\n')
            rate_match = re.match(r'RATE=([0-9.]+)', first_line)
            if not rate_match:
                raise SystemExit(f'bench: missing RATE= header in {path}')
            rate = float(rate_match.group(1))
            rate = int(rate) if rate.is_integer() else rate

            if name.endswith('-nginx-static') or name.endswith('-php'):
                metric = 'nginx-static' if name.endswith('-nginx-static') else 'php'
                host = name[: -len('-' + metric)]
                tool = 'vegeta'
                samples = parse_vegeta(body, name)
            elif name.endswith('-mysql'):
                metric = 'mysql'
                host = name[: -len('-mysql')]
                tool = 'sysbench'
                samples = parse_sysbench(body, name)
            else:
                raise SystemExit(f'bench: unrecognised raw file {path}')

            # Global, monotonic sample clock across both timed runs -- the
            # point is a readable sparkline, not a literal wall-clock axis.
            for i, s in enumerate(samples):
                s['t'] = i * BENCH_INTERVAL

            p50s = [s['p50_ms'] for s in samples if s['p50_ms'] is not None]
            p95s = [s['p95_ms'] for s in samples]
            successes = [s['success'] for s in samples]
            entry = {
                'host': host, 'metric': metric, 'tool': tool, 'rate': rate,
                'samples': samples,
                'median_p95': round(statistics.median(p95s), 3),
                'median_success': round(statistics.median(successes), 4),
            }
            if p50s:
                entry['median_p50'] = round(statistics.median(p50s), 3)
            entries.append(entry)

        entries.sort(key=lambda e: (e['host'], e['metric']))
        json.dump(entries, open('{{ out_base }}.json', 'w'), indent=2)
        print(f'bench: wrote {len(entries)} metric(s) to {{ out_base }}.json')
        "
      changed_when: true
      register: bench_result

    - name: Show bench result
      ansible.builtin.debug:
        var: bench_result.stdout
