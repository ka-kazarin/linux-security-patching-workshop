---
# Patch OS/middleware. Works for both stage and prod via the env variable
# (make patch ENV=stage|prod). One playbook for both environments — the
# demo's thesis: prod is rolled out with the exact code verified on stage
# (docs/en/README.md).
- name: Patch OS and middleware ({{ env | default('stage') }})
  hosts: "{{ env | default('stage') }}"
  become: true
  vars:
    # Frozen manifest from `make patch-plan` (ansible/patch-plan.yml, see its
    # header). Override with -e plan_file=... so `make rollout` can point
    # prod at the manifest that was actually tested on stage.
    plan_file: "results/patch-plan-{{ env | default('stage') }}.json"
  tasks:
    - name: Install unattended-upgrades (Debian/Ubuntu)
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == "Debian"

    # The stock 50unattended-upgrades ships the BARE "${distro_id}:${distro_codename}"
    # origin uncommented alongside "-security" — verified live: that means
    # unattended-upgrade would also install plain, non-security updates, not
    # just security ones. Override with a strict security-only allowlist
    # rather than edit the vendor file (survives package upgrades).
    - name: Restrict unattended-upgrades to security origins only (Debian/Ubuntu)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51unattended-upgrades-security-only
        content: |
          #clear Unattended-Upgrade::Allowed-Origins;
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-security";
              "${distro_id}ESMApps:${distro_codename}-apps-security";
              "${distro_id}ESM:${distro_codename}-infra-security";
          };
        mode: "0644"
      when: ansible_facts['os_family'] == "Debian"

    # VMs don't reliably report host power state — the default
    # OnlyOnACPower check treats a laptop-on-battery host as "on battery"
    # inside the guest too, silently skipping patching (caught live: a
    # suspended-then-resumed VM refused to patch with "System is on battery
    # power, stopping").
    - name: Don't gate patching on host AC power state (Debian/Ubuntu)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-ignore-power
        content: |
          Unattended-Upgrade::OnlyOnACPower "false";
        mode: "0644"
      when: ansible_facts['os_family'] == "Debian"

    - name: Determine this host's role (web/db) for cross-env manifest matching
      ansible.builtin.set_fact:
        patch_plan_role: "{{ 'web' if 'web' in group_names else 'db' }}"

    - name: Check whether a frozen patch-plan manifest exists for this env
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../{{ plan_file }}"
      delegate_to: localhost
      become: false
      register: patch_plan_stat

    # Manifests key packages by the host that was actually scanned (e.g.
    # web-stage) -- `make rollout` deliberately applies the STAGE manifest
    # against the PROD hosts (-e plan_file=results/patch-plan-stage.json),
    # where inventory_hostname is web-prod/db-prod, never a literal key in
    # that file. Fall back to any manifest host sharing this host's role
    # group (web/db -- the one thing stage and prod share) so the same
    # lookup resolves both on its own env (exact match) and applied
    # cross-env (role match).
    - name: Load this host's package list from the frozen patch-plan manifest, if any
      ansible.builtin.set_fact:
        patch_plan_pkgs: >-
          {{
            ((lookup('ansible.builtin.file', playbook_dir + '/../' + plan_file) | from_json).hosts
             if patch_plan_stat.stat.exists else {})
            | dict2items
            | selectattr('key', 'in', ([inventory_hostname] + groups[patch_plan_role]))
            | map(attribute='value.packages') | list | first | default([])
          }}

    - name: Notice when patching without a frozen patch-plan manifest
      ansible.builtin.debug:
        msg: >-
          No frozen patch-plan manifest at {{ plan_file }} -- applying
          whatever the mirror currently serves. Run `make patch-plan
          ENV={{ env | default('stage') }}` first for a reproducible,
          stage-tested package set before rolling out to prod.
      when: not patch_plan_stat.stat.exists

    - name: Install pinned security-update versions from the frozen patch-plan manifest (Debian/Ubuntu)
      ansible.builtin.apt:
        name: "{{ patch_plan_pkgs | map(attribute='name') | zip(patch_plan_pkgs | map(attribute='version')) | map('join', '=') | list }}"
        state: present
        allow_downgrade: true
      when:
        - ansible_facts['os_family'] == "Debian"
        - patch_plan_pkgs | length > 0

    - name: Apply security updates only (Debian/Ubuntu, apt -security pocket)
      ansible.builtin.command: unattended-upgrade -v
      register: uu_result
      changed_when: "'Packages that will be upgraded:' in uu_result.stdout and uu_result.stdout.split('Packages that will be upgraded:')[1].split('\\n')[0].strip() != ''"
      when:
        - ansible_facts['os_family'] == "Debian"
        - patch_plan_pkgs | length == 0

    - name: Install pinned security-update versions from the frozen patch-plan manifest (Oracle Linux)
      ansible.builtin.dnf:
        name: "{{ patch_plan_pkgs | map(attribute='name') | zip(patch_plan_pkgs | map(attribute='version')) | map('join', '-') | list }}"
        state: present
        allow_downgrade: true
      when:
        - ansible_facts['os_family'] == "RedHat"
        - patch_plan_pkgs | length > 0

    # dnf's `security: true` module option is a thin, easy-to-misread wrapper
    # (it still lists name: "*") — spelled out as the plain command Red Hat's
    # own docs give (access.redhat.com/solutions/10021) so there's no doubt
    # what's actually being run.
    - name: Apply security updates only (Oracle Linux, dnf upgrade --security)
      ansible.builtin.command: dnf upgrade --security -y
      register: dnf_security
      changed_when: "'Nothing to do' not in dnf_security.stdout"
      when:
        - ansible_facts['os_family'] == "RedHat"
        - patch_plan_pkgs | length == 0

    - name: Remove now-unneeded packages (Debian/Ubuntu)
      ansible.builtin.apt:
        autoremove: true
        autoclean: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Remove now-unneeded packages (Oracle Linux)
      ansible.builtin.dnf:
        autoremove: true
      when: ansible_facts['os_family'] == "RedHat"

    # Restart services against the libraries we just updated — never the
    # kernel (that needs a reboot; see reboot-cleanup.yml / `make
    # patch-reboot` for that half, kept separate since a reboot is
    # disruptive and shouldn't happen implicitly on every `make patch`).
    # needrestart does this out of the box on Debian/Ubuntu; RHEL family
    # only ships needs-restarting, which is report-only (no auto-restart),
    # so we just surface it.
    - name: Install needrestart (Debian/Ubuntu)
      ansible.builtin.apt:
        name: needrestart
        state: present
      when: ansible_facts['os_family'] == "Debian"

    # needrestart < 3.8 has known local-root vulnerabilities (CVE-2024-48990,
    # -48991, -10224, -11003 — see the opennet.ru writeup). Refuse to run an
    # older build rather than silently trusting it.
    - name: Check installed needrestart version (Debian/Ubuntu)
      ansible.builtin.command: dpkg-query -W -f='${Version}' needrestart
      register: needrestart_version
      changed_when: false
      when: ansible_facts['os_family'] == "Debian"

    - name: Refuse to run needrestart older than 3.8 (known local-root CVEs)
      ansible.builtin.assert:
        that: needrestart_version.stdout is version('3.8', '>=')
        fail_msg: >-
          needrestart {{ needrestart_version.stdout }} is older than 3.8 —
          vulnerable to CVE-2024-48990/-48991/-10224/-11003. Refusing to run
          it; update apt sources to get a patched build.
      when: ansible_facts['os_family'] == "Debian"

    - name: Restart services against updated libraries (Debian/Ubuntu, never the kernel)
      ansible.builtin.command: needrestart -r a -b
      changed_when: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Install dnf-utils for needs-restarting (Oracle Linux)
      ansible.builtin.dnf:
        name: dnf-utils
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    - name: Check whether services/kernel need a restart (Oracle Linux, report-only)
      ansible.builtin.command: dnf needs-restarting -r
      register: needs_restart
      failed_when: false
      changed_when: false
      when: ansible_facts['os_family'] == "RedHat"

    - name: Show needs-restarting result (Oracle Linux)
      ansible.builtin.debug:
        var: needs_restart.stdout_lines
      when: ansible_facts['os_family'] == "RedHat"

    # TODO: targeted WordPress patch to 7.0.2 (app layer, dev owner), a
    # minimal-window php-fpm/nginx restart; kernel livepatch as a separate play.
