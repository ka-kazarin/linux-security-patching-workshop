---
# Computes pending SECURITY updates as {name, version} per host, WITHOUT
# installing anything -- freezes the exact set patch.yml's manifest-aware
# install path applies later. Writes a SINGLE results/patch-plan.json (no env
# suffix): the intended flow is collect the plan against prod's real pending
# set (`make patch-plan ENV=prod`), test that same plan on stage (`make patch
# ENV=stage`), then ship it to prod (`make rollout`) -- one file, one plan,
# every command reads it. env here only picks which hosts to scan; the
# manifest records it in an `env` field but the filename stays generic (like
# scan-before.html / bench.html). Same "gather on hosts, merge+render on the
# controller" shape as scan.yml. Vars: env=stage|prod (default stage),
# out=path without extension (default results/patch-plan) -- .json/.html
# get appended.
- name: Reset patch-plan workspace on the controller
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    # Same reason as scan.yml's workspace reset: without this, a plan
    # scoped to one env still merges in stale per-host files a previous,
    # wider run left behind.
    - name: Clear per-host plan data left over from a previous run
      ansible.builtin.file:
        path: /tmp/stand-patch-plan
        state: "{{ item }}"
      loop: [absent, directory]

- name: Compute pending security updates ({{ env | default('stage') }})
  hosts: "{{ env | default('stage') }}"
  become: true
  tasks:
    # --- Debian/Ubuntu -----------------------------------------------------
    # Same security-only allowlist patch.yml applies for real -- a dry-run
    # without it would report ordinary updates too, giving a plan that
    # doesn't match what patch.yml would actually install.
    - name: Install unattended-upgrades (Debian/Ubuntu)
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Restrict unattended-upgrades to security origins only (Debian/Ubuntu)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51unattended-upgrades-security-only
        content: |
          #clear Unattended-Upgrade::Allowed-Origins;
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-security";
              "${distro_id}ESMApps:${distro_codename}-apps-security";
              "${distro_id}ESM:${distro_codename}-infra-security";
          };
        mode: "0644"
      when: ansible_facts['os_family'] == "Debian"

    - name: Don't gate the dry-run on host AC power state (Debian/Ubuntu)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-ignore-power
        content: |
          Unattended-Upgrade::OnlyOnACPower "false";
        mode: "0644"
      when: ansible_facts['os_family'] == "Debian"

    # Machine-readable, not the prose of `unattended-upgrade -v`: that free
    # text mixed the package list with its own log tail (".. All upgrades
    # installed", "The list of kept packages can't be calculated .."), and
    # the stray apostrophe in that tail broke the shell. `apt-get -s
    # dist-upgrade` instead prints one `Inst <pkg> [<old>] (<new> <origin>
    # [<arch>])` line per package -- keep only -security-pocket lines and
    # read <new> (exactly the version `apt-get install <pkg>=<new>` would
    # pull, the same path patch.yml's real install takes) straight off the
    # line. dist-upgrade (not upgrade) so a security kernel/meta bump that
    # pulls a new package is captured; only Inst lines are taken, so any Remv
    # is ignored (old kernels are handled by patch-reboot).
    - name: List pending SECURITY upgrades as "name version" (Debian/Ubuntu)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          LANG=C apt-get -s dist-upgrade 2>/dev/null | awk '
            /^Inst / && /-security/ {
              pkg = $2
              ver = ""
              for (i = 3; i <= NF; i++) if ($i ~ /^\(/) { ver = substr($i, 2); break }
              if (ver != "") print pkg " " ver
            }'
        executable: /bin/bash
      register: deb_pkg_versions
      changed_when: false
      when: ansible_facts['os_family'] == "Debian"

    # Self-describing plain text, one "name version" pair per line -- parsed
    # on the controller in the final play. No ---UPDATEINFO--- marker (see
    # the Oracle Linux side below) is how the parser tells the two formats
    # apart. Write deb_pkg_versions.stdout DIRECTLY (it already has real
    # newlines from awk): `stdout_lines | join('\n')` renders '\n' as a
    # literal backslash-n inside a `content: |` block, collapsing the whole
    # list onto one line the parser then can't read (caught live -- the
    # Oracle side never hit this because it writes .stdout directly too).
    - name: Write the pending-packages list to the controller workspace (Debian/Ubuntu)
      ansible.builtin.copy:
        content: |
          OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          {{ deb_pkg_versions.stdout | default('') }}
        dest: /tmp/stand-patch-plan/{{ inventory_hostname }}.txt
      delegate_to: localhost
      become: false
      when: ansible_facts['os_family'] == "Debian"

    # --- Oracle Linux --------------------------------------------------------
    # dnf's own check-update/updateinfo, not `dnf upgrade --security
    # --assumeno`: fixed columnar output (name.arch version repo) meant to
    # be scripted, rather than a formatted transaction table meant for a
    # human terminal -- and updateinfo's advisory IDs come for free once
    # we're already calling dnf for the package list. rc 100 means "updates
    # available", not a failure.
    - name: List pending security package updates (Oracle Linux, dnf check-update)
      ansible.builtin.command: dnf -q check-update --security
      register: rh_check_update
      changed_when: false
      failed_when: rh_check_update.rc not in [0, 100]
      when: ansible_facts['os_family'] == "RedHat"

    - name: List security advisories covering pending updates (Oracle Linux)
      ansible.builtin.command: dnf -q updateinfo list security
      register: rh_updateinfo
      changed_when: false
      when: ansible_facts['os_family'] == "RedHat"

    - name: Write the pending-packages / advisories data to the controller workspace (Oracle Linux)
      ansible.builtin.copy:
        content: |
          OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          {{ rh_check_update.stdout }}
          ---UPDATEINFO---
          {{ rh_updateinfo.stdout }}
        dest: /tmp/stand-patch-plan/{{ inventory_hostname }}.txt
      delegate_to: localhost
      become: false
      when: ansible_facts['os_family'] == "RedHat"

- name: Build the patch-plan manifest and HTML report (controller-side)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # IMPORTANT: connection: local runs shell/command with cwd = the
    # playbook file's directory (ansible/), not wherever ansible-playbook
    # was invoked from (same gotcha as scan.yml) -- every path below is
    # absolute via playbook_dir plus a walk up to the repo root.
    repo_root: "{{ playbook_dir }}/.."
    out_base: "{{ repo_root }}/{{ out | default('results/patch-plan') }}"
  tasks:
    - name: Parse per-host plan data and write the manifest JSON
      ansible.builtin.shell: |
        python3 -c "
        import glob, json, os, time, urllib.request
        from datetime import datetime, timezone

        # Ubuntu apt package indices carry NO advisory metadata -- unlike dnf's
        # updateinfo, which hands the Oracle side its ELSA IDs for free. So for
        # Ubuntu we enrich the pending packages from Canonical's live Ubuntu
        # Security Notices feed (notices.json), matching each pending package
        # to the USN that shipped its EXACT fixed version -- no stale USNs.
        # Best-effort and symmetric with the Oracle ELSA linkage: any
        # network/API failure just leaves advisories empty (an honest '--',
        # same as Oracle when updateinfo has no entry), the frozen package plan
        # itself is never affected.
        CODENAMES = {'26.04': 'resolute', '24.04': 'noble', '22.04': 'jammy'}

        def usn_map(codename):
            base = 'https://ubuntu.com/security/notices.json'
            # limit=20 is the API's hard maximum -- anything larger 422s (and
            # the except below would then swallow it into an empty map), so page
            # through in 20s; the offset<5000 cap is just a runaway guard.
            found, offset, limit = {}, 0, 20
            while offset < 5000:
                url = (base + '?release=' + codename + '&order=newest'
                       + '&limit=' + str(limit) + '&offset=' + str(offset))
                # Paging through ~18 requests, a single transient read timeout
                # shouldn't wipe every advisory -- retry a few times, and only
                # give up (keeping whatever we already gathered) if a page is
                # truly unreachable.
                data = None
                for attempt in range(4):
                    try:
                        with urllib.request.urlopen(url, timeout=20) as resp:
                            data = json.load(resp)
                        break
                    except Exception:
                        time.sleep(1.5)
                if data is None:
                    break
                notices = data.get('notices', [])
                for n in notices:
                    usn = n.get('id')
                    if not usn:
                        continue
                    for p in n.get('release_packages', {}).get(codename, []):
                        key = (p.get('name'), p.get('version'))
                        if key[0] and key[1]:
                            found.setdefault(key, set()).add(usn)
                offset += len(notices)
                if not notices or offset >= data.get('total_results', 0):
                    break
            return found

        hosts = {}
        debian_hosts = []
        for path in sorted(glob.glob('/tmp/stand-patch-plan/*.txt')):
            host = os.path.basename(path)[:-4]
            lines = open(path, encoding='utf-8').read().splitlines()
            os_label = lines[0][4:] if lines and lines[0].startswith('OS: ') else 'unknown'
            body = lines[1:]
            packages = []
            if '---UPDATEINFO---' in body:
                # Oracle Linux: dnf check-update above the marker, dnf
                # updateinfo below -- join advisories to packages by NEVRA
                # prefix (updateinfo has no separate package-name column).
                sep = body.index('---UPDATEINFO---')
                check_update, updateinfo = body[:sep], body[sep + 1:]
                seen = set()
                for line in check_update:
                    # dnf check-update appends an 'Obsoleting Packages' section
                    # listing obsoleting/obsoleted version PAIRS -- each a
                    # 3-column line that is NOT a pending update. Stop before
                    # it, else the plan collects several versions of the same
                    # package and 'dnf install' then refuses with 'cannot
                    # install both grub2-tools-<v1> and grub2-tools-<v2>'
                    # (caught live). Dedup by name too, defensively.
                    if line.strip().startswith('Obsoleting'):
                        break
                    parts = line.split()
                    if len(parts) == 3 and '.' in parts[0]:
                        name = parts[0].rsplit('.', 1)[0]
                        if name not in seen:
                            seen.add(name)
                            packages.append({'name': name, 'version': parts[1]})
                advisories = {}
                for line in updateinfo:
                    parts = line.split()
                    if len(parts) >= 3:
                        advisory_id, nevra = parts[0], parts[-1]
                        for pkg in packages:
                            if nevra.startswith(pkg['name'] + '-'):
                                advisories.setdefault(pkg['name'], set()).add(advisory_id)
                for pkg in packages:
                    if pkg['name'] in advisories:
                        pkg['advisories'] = sorted(advisories[pkg['name']])
            else:
                # Debian/Ubuntu: plain 'name version' lines. USN advisories
                # get attached after the loop (apt gives no advisory IDs
                # inline, so it can't be done per-line here like Oracle).
                for line in body:
                    parts = line.split()
                    if len(parts) == 2:
                        packages.append({'name': parts[0], 'version': parts[1]})
                debian_hosts.append(host)
            hosts[host] = {
                'os': os_label,
                'packages': packages,
                'counts': {
                    'packages': len(packages),
                    'advisories': sum(len(p.get('advisories', [])) for p in packages),
                },
            }

        # Enrich Ubuntu hosts with USN advisories now that every host is
        # parsed -- one feed fetch covers them all (the stand's Ubuntu hosts
        # share one release). This runs on the controller, which has the
        # network the plan is generated from; the Oracle advisories were
        # already resolved on their own host by dnf.
        if debian_hosts:
            ver = next((hosts[h]['os'].split()[1] for h in debian_hosts
                        if len(hosts[h]['os'].split()) > 1), '')
            code = CODENAMES.get(ver[:5])
            umap = usn_map(code) if code else {}
            for h in debian_hosts:
                for pkg in hosts[h]['packages']:
                    adv = sorted(umap.get((pkg['name'], pkg['version']), ()))
                    if adv:
                        pkg['advisories'] = adv
                hosts[h]['counts']['advisories'] = sum(
                    len(p.get('advisories', [])) for p in hosts[h]['packages'])

        manifest = {
            'env': '{{ env | default('stage') }}',
            'generated_at': datetime.now(timezone.utc).isoformat(),
            'hosts': hosts,
        }
        out_path = '{{ out_base }}.json'
        os.makedirs(os.path.dirname(out_path) or '.', exist_ok=True)
        json.dump(manifest, open(out_path, 'w'), indent=2, sort_keys=True)
        total = sum(h['counts']['packages'] for h in hosts.values())
        print(f'patch-plan: {total} package(s) across {len(hosts)} host(s)')
        "
      changed_when: true
      register: plan_result

    - name: Show plan result
      ansible.builtin.debug:
        var: plan_result.stdout

    - name: Render the HTML patch-plan report
      ansible.builtin.command:
        cmd: >
          python3 {{ repo_root }}/scan/patch_plan_report.py
          --manifest {{ out_base }}.json --html {{ out_base }}.html
      changed_when: true

    - name: Report done
      ansible.builtin.debug:
        msg: "Done: {{ out_base }}.json / {{ out_base }}.html"
